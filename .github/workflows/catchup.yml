name: catch-up

# Manual. Announces filings from a given date that the silent first-run baseline stored without an alert.
on:
  workflow_dispatch:
    inputs:
      since:
        description: "Announce unannounced filings dated on or after this day (YYYY-MM-DD)"
        required: true
        default: "2026-11-23"
      source:
        description: "Only filings reported by this source, e.g. sebi (leave empty for all)"
        required: false
        default: "sebi"

concurrency:
  group: radar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Send the missed filings to the channel
        run: python -m radar.catchup
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          ALERT_SEGMENTS: ${{ vars.ALERT_SEGMENTS || 'sme,unknown,mainboard' }}
          CATCHUP_SINCE: ${{ inputs.since }}
          CATCHUP_SOURCE: ${{ inputs.source }}

      - name: Save state
        if: always()
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add -A data docs
          if git diff --cached --quiet; then
            echo "No changes to save"
          else
            git commit -m "Record catch-up alerts [skip ci]"
            # If someone pushed while this run was working, replay this commit on top. In a clash the bot's own
            # newest files (state, data, page) win, so a saved state can never be lost and alerts never repeat.
            for attempt in 1 2 3; do
              git pull --rebase -X theirs -q origin "$GITHUB_REF_NAME" && git push -q && exit 0
              sleep 5
            done
            echo "Could not save after 3 tries" >&2
            exit 1
          fi
