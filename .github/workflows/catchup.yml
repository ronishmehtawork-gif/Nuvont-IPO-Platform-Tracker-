name: catch-up

# Manual. Announces filings from a given date that the silent first-run baseline stored without an alert.
on:
  workflow_dispatch:
    inputs:
      since:
        description: "Announce unannounced filings dated on or after this day (YYYY-MM-DD)"
        required: true
        default: "2026-11-23"

concurrency:
  group: radar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Send the missed filings to the channel
        run: python -m radar.catchup
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          ALERT_SEGMENTS: ${{ vars.ALERT_SEGMENTS || 'sme,unknown,mainboard' }}
          CATCHUP_SINCE: ${{ inputs.since }}

      - name: Save state
        if: always()
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add -A data docs
          if git diff --cached --quiet; then
            echo "No changes to save"
          else
            git commit -m "Record catch-up alerts [skip ci]"
            git push
          fi
