name: radar

on:
  schedule:
    - cron: "3,18,33,48 * * * *" # every 15 minutes, off the busy :00/:15/:30/:45 marks where GitHub drops or delays runs
  workflow_dispatch:

concurrency:
  group: radar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check sources and send alerts
        run: python -m radar.run
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          ALERT_SEGMENTS: ${{ vars.ALERT_SEGMENTS || 'sme,unknown,mainboard' }}
          RADAR_SITE_URL: ${{ vars.RADAR_SITE_URL }}

      - name: Keep page snapshots for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: snapshots/
          retention-days: 3
          if-no-files-found: ignore

      - name: Save state
        if: always()
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add -A data docs
          if git diff --cached --quiet; then
            echo "No changes to save"
          else
            git commit -m "Update radar state [skip ci]"
            git push
          fi
