name: radar

on:
  schedule:
    # Backup only. GitHub fires its own schedule a few times a day at best, so each run starts the next one
    # (see the last step and tick.yml). If that chain ever breaks, one of these restarts it.
    # GitHub reads cron in UTC: 01:33-13:33 UTC = 07:03-19:03 IST. Minute 33 avoids the busy :00/:30 marks.
    - cron: "33 1-13 * * *"
  workflow_dispatch:

concurrency:
  group: radar
  cancel-in-progress: false

permissions:
  contents: write
  actions: write   # to start the next run through tick.yml

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check sources and send alerts
        run: python -m radar.run
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          ALERT_SEGMENTS: ${{ vars.ALERT_SEGMENTS || 'sme,unknown,mainboard' }}
          ALERT_MAX_AGE_DAYS: ${{ vars.ALERT_MAX_AGE_DAYS || '45' }}
          RADAR_SITE_URL: ${{ vars.RADAR_SITE_URL || 'https://ronishmehtawork-gif.github.io/Nuvont-IPO-Platform-Tracker-/' }}
          # WhatsApp is optional. Without the first three it stays off and Telegram carries on as before.
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_ID: ${{ secrets.WHATSAPP_PHONE_ID }}
          WHATSAPP_RECIPIENTS: ${{ secrets.WHATSAPP_RECIPIENTS }}
          WHATSAPP_TEMPLATE_DRHP: ${{ vars.WHATSAPP_TEMPLATE_DRHP }}
          WHATSAPP_TEMPLATE_UPDATE: ${{ vars.WHATSAPP_TEMPLATE_UPDATE }}
          WHATSAPP_API_VERSION: ${{ vars.WHATSAPP_API_VERSION }}
          WHATSAPP_JOIN_NUMBER: ${{ vars.WHATSAPP_JOIN_NUMBER }}
          WHATSAPP_JOIN_URL: ${{ vars.WHATSAPP_JOIN_URL }}

      - name: Keep page snapshots for debugging
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: snapshots
          path: snapshots/
          retention-days: 3
          if-no-files-found: ignore

      - name: Save state
        if: always()
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add -A data docs
          if git diff --cached --quiet; then
            echo "No changes to save"
          else
            git commit -m "Update radar state [skip ci]"
            # If someone pushed while this run was working, replay this commit on top. In a clash the bot's own
            # newest files (state, data, page) win, so a saved state can never be lost and alerts never repeat.
            for attempt in 1 2 3; do
              git pull --rebase -X theirs -q origin "$GITHUB_REF_NAME" && git push -q && exit 0
              sleep 5
            done
            echo "Could not save after 3 tries" >&2
            exit 1
          fi

      # Keeps the radar going without depending on GitHub's schedule: start one waiting job (tick.yml) that starts
      # the next run after the pause chosen in radar/cadence.py. Only one wait exists at a time. To stop the chain,
      # set the repository variable RADAR_CHAIN to off; the backup schedule above then runs hourly as before.
      - name: Start the next run
        if: always() && vars.RADAR_CHAIN != 'off'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          waiting=$(gh run list --workflow tick.yml --status in_progress --json databaseId --jq length)
          queued=$(gh run list --workflow tick.yml --status queued --json databaseId --jq length)
          if [ "$((waiting + queued))" -gt 0 ]; then
            echo "A wait is already running"
          else
            gh workflow run tick.yml --ref "$GITHUB_REF_NAME" -f minutes="$(python -m radar.cadence)"
          fi
